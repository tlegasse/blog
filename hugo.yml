baseURL: https://www.tannerlegasse.com/
languageCode: en-us
title: Tanner Legasse
theme: mainroad
enableRobotsTXT: true

languages:
  en:
    languageName: "English"
    weight: 1

    taxonomies:
      category: categories
      tag: tags
      series: series
      decade: toaster-decade
      brand: toaster-brands
      style: toaster-styles

    menu:
      main:
        - name: Search
          url: /search/
          weight: 10
        - identifier: linkedin
          url: "https://www.linkedin.com/in/tanner-legasse/"
          pre: <span class="social-icon linkedin-icon"></span>
        - identifier: github
          url: "https://github.com/tlegasse"
          pre: <span class="social-icon github-icon"></span>
params:
  description: "Tanner Legasse is a senior back end developer writing about Shopify app development, Go, security, demoscene programming, and a large collection of vintage toasters."
  author: Tanner Legasse
  opengraph: true
  schema: true
  twitter_cards: true

  logo:
    title: Tanner <span>Legasse</span>

  homeInfoParams:
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowBreadCrumbs: true
  ShowToc: true
  disableSpecial1stPost: true
  comments: true

  sidebar:
    home: "left"
    list: "left" 
    single: false
    widgets: 
      - "search"
      - "recent"
      # - "categories"
      - "toaster-decades"
      - "recent-albums"

  widgets:
    recent_num: 5
    categories_counter: false
    tags_counter: false

  contact:
    email: tanner@legasse.dev

  assets:
    disableHLJS: false

  cover:
    hidden: false # hide everywhere but not in structured data
    hiddenInList: false # hide on list pages and home
    hiddenInSingle: false # hide on single page

  mainSections:
    - projects
    - posts

  googleFontsLink: "https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap"
  googleFontsSerifLink: "https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap"
  googleFontsMonoLink: "https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap"

  style:
    vars:
      highlightColor: "#4255C3"
      highlightColorRgb: "66, 85, 195"
      secondaryHighlightColor: "#B63535"
      secondaryHighlightColorRgb: "182, 53, 53"
      backgroundColor: "#F1F1F1"
      backgroundColorRgb: "241, 241, 241"
      secondaryBackgroundColor: "#fffadc"
      secondaryBackgroundColorRgb: "255, 249, 229"
      fontFamilyPrimary: "IBM Plex Serif"
      fontFamilySecondary: "IBM Plex Sans"
      fontFamilyMono: "IBM Plex Mono"

services:
  disqus:
    shortname: tannerlegasse

markup:
  goldmark:
    renderer:
      unsafe: true

  highlight:
    noClasses: false

mediaTypes:
  text/markdown:
    suffixes: ["md"]

# LLM-friendly outputs. Everything below is generated from the normal content
# at build time; nothing is maintained by hand.
#   /llms.txt            index of the site (https://llmstxt.org)
#   /llms-full.txt       every page's content in one Markdown file
#   <any page>/index.md  Markdown version of that page
#   /toasters/index.json the toaster collection as structured data
outputFormats:
  markdown:
    mediaType: text/markdown
    baseName: index
    isPlainText: true
    rel: alternate
    permalinkable: false
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
    root: true
  llmsfull:
    mediaType: text/plain
    baseName: llms-full
    isPlainText: true
    notAlternative: true
    root: true

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - markdown
    - llms
    - llmsfull
  page:
    - HTML
    - markdown
  section:
    - HTML
    - RSS
    - markdown
    - JSON
  taxonomy:
    - HTML
    - RSS
    - markdown
  term:
    - HTML
    - RSS
    - markdown

module:
  mounts:
    - source: content
      target: content
      excludeFiles:
        - templates/**

security:
  allowContent: ['.*']
